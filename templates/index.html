<!DOCTYPE html>
<html>
<head>

    <title>Employee Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Employee Management System</h1>

    <div class="container">

        <h2>Add Employee</h2>

        <form id="employeeForm">

            <input type="text"
                   id="employee_id"
                   placeholder="Employee ID"
                   required>

            <input type="text"
                   id="name"
                   placeholder="Name"
                   required>

            <input type="text"
                   id="department"
                   placeholder="Department"
                   required>

            <input type="text"
                   id="designation"
                   placeholder="Designation"
                   required>

            <input type="number"
                   id="salary"
                   placeholder="Salary"
                   required>

            <input type="text"
                   id="contact"
                   placeholder="Contact"
                   required>

            <button type="submit">
                Add Employee
            </button>

        </form>


        <h2>Search Employee</h2>

        <input type="text"
               id="search"
               placeholder="Search by ID, Name or Department">

        <button onclick="searchEmployees()">
            Search
        </button>

        <button onclick="loadEmployees()">
            Show All
        </button>


        <h2>Employee List</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>Contact</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="employeeList"></tbody>

        </table>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
